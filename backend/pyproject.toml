[project]
name = "backend"
version = "0.1.0"
description = "Missing Vowels game backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=6.0.2",
    # Direct pin (otherwise only a transitive dep of flask) to keep us off
    # the CVE-affected werkzeug 3.1.4.
    "werkzeug>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14.0",
    "ty>=0.0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["categories"]
